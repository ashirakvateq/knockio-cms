<!-- Cal.com Scheduling Section -->
<section
  id="cal-sec"
  class="py-36 max-xl:py-28 max-lg:py-20 max-md:py-16"
>
  <div class="my-container">
    <div
      class="mx-auto max-w-[1440px] rounded-3xl bg-[linear-gradient(90deg,#0b1f12_0%,#0f2a17_100%)] px-6 py-20 sm:px-8 sm:py-24 lg:px-12 lg:py-28 xl:px-16"
    >
      <!-- Heading Content -->
      <div class="mx-auto mb-10 max-w-3xl text-center max-md:mb-8">
        <p
          class="mb-3 text-sm font-medium leading-7 text-primary-500 md:text-2xl"
        >
          See Knockio In Action
        </p> 

        <h2
          class="mb-0 text-3xl font-bold leading-tight text-white sm:text-4xl lg:text-[42px] lg:leading-none xl:text-5xl 2xl:text-[56px]"
        >
          Book a Demo Now!
        </h2>
      </div>

      <!-- Cal.com Calendar Wrapper -->
      <div
        class="mx-auto max-w-5xl overflow-hidden rounded-2xl bg-white p-2 shadow-xl sm:p-3 lg:p-4"
      >
        <!-- Cal.com Inline Embed -->
        <div
          id="my-cal-inline"
          class="min-h-[650px] w-full overflow-hidden sm:min-h-[700px]"
        ></div>

        <!-- Cal.com Embed Script -->
        <script type="text/javascript">
          (function (C, A, L) {
            const pushToQueue = function (api, args) {
              api.q.push(args);
            };

            const documentReference = C.document;

            C.Cal =
              C.Cal ||
              function () {
                const cal = C.Cal;
                const args = arguments;

                if (!cal.loaded) {
                  cal.ns = {};
                  cal.q = cal.q || [];

                  const script = documentReference.createElement("script");
                  script.src = A;
                  script.async = true;

                  documentReference.head.appendChild(script);
                  cal.loaded = true;
                }

                if (args[0] === L) {
                  const api = function () {
                    pushToQueue(api, arguments);
                  };

                  const namespace = args[1];

                  api.q = api.q || [];

                  if (typeof namespace === "string") {
                    cal.ns[namespace] = cal.ns[namespace] || api;

                    pushToQueue(cal.ns[namespace], args);
                    pushToQueue(cal, ["initNamespace", namespace]);
                  } else {
                    pushToQueue(cal, args);
                  }

                  return;
                }

                pushToQueue(cal, args);
              };
          })(window, "https://app.cal.com/embed/embed.js", "init");

          Cal("init", "30-minute", {
            origin: "https://cal.com",
          });

          /**
           * Gets a query parameter using case-insensitive matching.
           *
           * @param {string[]} parameterNames
           * @returns {string}
           */
          function getQueryParamCaseInsensitive(parameterNames) {
            const urlParams = new URLSearchParams(window.location.search);

            // Check exact parameter names first.
            for (const parameterName of parameterNames) {
              const directValue = urlParams.get(parameterName);

              if (directValue) {
                return directValue;
              }
            }

            // Check all parameters using case-insensitive matching.
            const normalizedNames = parameterNames.map(function (name) {
              return name.toLowerCase();
            });

            for (const [key, value] of urlParams.entries()) {
              if (
                normalizedNames.includes(key.toLowerCase()) &&
                value.trim() !== ""
              ) {
                return value;
              }
            }

            return "";
          }

          /**
           * Collects supported advertising and UTM parameters
           * from the current page URL.
           *
           * @returns {string}
           */
          function getTrackingParamsForCal() {
            const trackingParams = new URLSearchParams();

            const customGclid = getQueryParamCaseInsensitive([
              "gclid",
              "custom_gclid",
            ]);

            const customFbclid = getQueryParamCaseInsensitive([
              "fbclid",
              "custom_fbclid",
            ]);

            const customMsclkid = getQueryParamCaseInsensitive([
              "msclkid",
              "custom_msclkid",
            ]);

            const utmSource = getQueryParamCaseInsensitive(["utm_source"]);
            const utmMedium = getQueryParamCaseInsensitive(["utm_medium"]);
            const utmCampaign = getQueryParamCaseInsensitive(["utm_campaign"]);

            if (customGclid) {
              trackingParams.set("custom_gclid", customGclid);
            }

            if (customFbclid) {
              trackingParams.set("custom_fbclid", customFbclid);
            }

            if (customMsclkid) {
              trackingParams.set("custom_msclkid", customMsclkid);
            }

            if (utmSource) {
              trackingParams.set("utm_source", utmSource);
            }

            if (utmMedium) {
              trackingParams.set("utm_medium", utmMedium);
            }

            if (utmCampaign) {
              trackingParams.set("utm_campaign", utmCampaign);
            }

            return trackingParams.toString();
          }

          let calLink = "knockio-demo/30-minute";
          const trackingQuery = getTrackingParamsForCal();

          if (trackingQuery) {
            calLink += "?" + trackingQuery;
          }

          Cal.ns["30-minute"]("inline", {
            elementOrSelector: "#my-cal-inline",
            config: {
              layout: "month_view",
              theme: "light",
            },
            calLink: calLink,
          });
        </script>
      </div>
    </div>
  </div>
</section>
